# El repo no tenía ninguna comprobación automática. La capa RF pinta un mapa de
# cobertura que se mira para decidir dónde va una NCU, y se equivocaba en 27 dB
# sin que nada lo dijera (RF-01). Un banco que no corre nadie es decoración.
name: tests
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # EL REPO HERMANO, QUE HASTA HOY NO SE CLONABA. Cuatro pasos de abajo
      # necesitan `Cobertura-Zigbee` al lado, y sin el imprimian «No se ha
      # medido nada. Esto no es un verde» y salian en VERDE igual. Entre ellos
      # el careo del terreno contra el 3D —200.000 muestras bit a bit— y el
      # careo de cotas de equipo entre los dos repos: dos puertas de verdad que
      # NUNCA habian corrido aqui.
      #
      # El hermano es publico, asi que no hace falta ningun secreto. `--depth 1`
      # trae 78 MB en ~2 s.
      #
      # Si el clonado falla NO se para el job: los cuatro utiles salen entonces
      # con rc = 2 y el censo del final lo publica como NO COMPROBADO, que es
      # distinto de verde. Un fallo de red no es un hallazgo, pero tampoco un
      # aprobado.
      - name: el repo hermano, al lado (es publico)
        continue-on-error: true
        run: |
          git clone --depth 1 -q https://github.com/IMoriana3/cobertura-zigbee.git ../Cobertura-Zigbee \
            && echo "hermano clonado: $(du -sh ../Cobertura-Zigbee | cut -f1)" \
            || echo "SIN HERMANO: el clonado fallo. Los careos saldran con rc = 2."
      # EL CORREDOR, que ya no mira solo el codigo de salida.
      #
      # Antes esto era un `for f in tests/test_*.js; do node "$f" || rc=1; done`
      # — o sea, el codigo de salida y nada mas. Y el codigo de salida es justo
      # lo que nos ha mentido dos veces en un dia: cuatro pasos de esta CI
      # decian «no se ha medido nada» y salian con 0, y en cobertura-zigbee un
      # banco entraba sin argumentos, daba cero vueltas y llevaba cuatro meses
      # en verde sin mirar una planta (#741).
      #
      # `tests/correr.sh` aplica la regla de factiun-cartera: verde es salir
      # con 0 **y** sin lineas de fallo **y** publicando al menos PISO
      # comprobaciones. Trae ademas dos guardias: un banco nuevo sin piso se
      # pone ROJO, y una exencion sobre un fichero borrado tambien.
      - name: banco de pruebas (con piso por banco)
        run: bash tests/correr.sh

      # LA HERRAMIENTA DE INFORME, aunque no sea un banco. Extrae `rfRows` y
      # `buildAdjacency` del HTML con una expresión regular, así que se rompe
      # sola el día que alguien los renombre — y sin esto se rompería en
      # silencio, el día que a alguien le hiciera falta.
      - name: la herramienta de malla arranca sobre una planta real
        run: node tools/malla_plantas.mjs --planta BURGO > /dev/null

      # EL CAREO CONTRA EL 3D NO PUEDE CORRER AQUI —necesita cobertura-zigbee, y
      # un banco que dependa del repo hermano sale verde en una maquina y rojo
      # en la otra; ya paso en este repo—. Pero SI arranca, y eso es justo lo
      # que habria cazado el `require('/home/user/Siting/...')` absoluto que
      # llevaba dentro uno de los utiles que nadie corria. Sin hermano carga el
      # motor, comprueba que la API que usa sigue existiendo, dice que no ha
      # comprobado nada y sale con 0.
      # LAS ONCE PLANTAS, NO UNA. `careo_terreno_3d.mjs` corre por defecto contra
      # `dicayagua_relieve.json` y punto, asi que «el motor y el 3D leen el
      # mismo fichero bit a bit» estaba confirmado para UNA de once. Salio al
      # preguntarse que afirmaciones se apoyaban en este paso, ahora que por fin
      # corre. Medidas las once: 0 discrepancias y peor |delta| = 0 en todas, y
      # cuestan 4 s enteras.
      - name: el careo del terreno contra el 3D (las once plantas)
        run: |
          set +e
          rc=0; n=0
          for f in ../Cobertura-Zigbee/*_relieve.json; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            case "$b" in *demsolo*) continue;; esac
            node tools/careo_terreno_3d.mjs --relieve "$b" || rc=$?
            n=$((n+1))
          done
          # cero plantas careadas NO es un verde: es el hermano ausente
          if [ "$n" = "0" ]; then echo "SIN CAREO: ninguna planta careada"; rc=2; fi
          echo "plantas careadas: $n"
          set -e
          echo "$rc|el careo del terreno contra el 3D" >> "$RUNNER_TEMP/censo_bancos"
          if [ "$rc" = "1" ]; then exit 1; fi
          if [ "$rc" != "0" ]; then echo "::warning title=NO COMPROBADO::el careo del terreno contra el 3D no ha medido nada (rc=$rc)"; fi

      # Igual que el de arriba: necesita los levantamientos de ayora y sanjose,
      # que viven en el hermano. Aqui solo se comprueba que arranca y que la
      # API del motor que usa sigue existiendo.
      - name: el relieve por planta
        run: |
          set +e
          node tools/relieve_plantas.mjs
          rc=$?
          set -e
          echo "$rc|el relieve por planta" >> "$RUNNER_TEMP/censo_bancos"
          if [ "$rc" = "1" ]; then exit 1; fi
          if [ "$rc" != "0" ]; then echo "::warning title=NO COMPROBADO::el relieve por planta no ha medido nada (rc=$rc)"; fi

      # Lo mismo: los layouts con meteo viven en el hermano.
      - name: la antena de la HSU
        run: |
          set +e
          node tools/antena_hsu.mjs
          rc=$?
          set -e
          echo "$rc|la antena de la HSU" >> "$RUNNER_TEMP/censo_bancos"
          if [ "$rc" = "1" ]; then exit 1; fi
          if [ "$rc" != "0" ]; then echo "::warning title=NO COMPROBADO::la antena de la HSU no ha medido nada (rc=$rc)"; fi

      # LAS COTAS DE EQUIPO QUE ESTE REPO COPIA. La mitad que SI corre sin
      # hermano —y es la que de verdad impide que el problema vuelva— es que
      # ninguna `_fuente` cite un NUMERO DE LINEA. Se encontraron SIETE citas
      # asi y SEIS estaban caducadas: nadie las movio, se movieron solas cuando
      # el PR #714 anyadio comentarios a esos ficheros. Una cita podrida es peor
      # que ninguna, porque parece que alguien lo comprobo.
      - name: las cotas de equipo y sus citas
        run: |
          set +e
          node tools/careo_equipos.mjs
          rc=$?
          set -e
          echo "$rc|las cotas de equipo y sus citas" >> "$RUNNER_TEMP/censo_bancos"
          if [ "$rc" = "1" ]; then exit 1; fi
          if [ "$rc" != "0" ]; then echo "::warning title=NO COMPROBADO::las cotas de equipo y sus citas no ha medido nada (rc=$rc)"; fi

      # ESTE SI MIDE EN CI, porque el terreno viaja con el proyecto y vive en
      # este repo: no depende del hermano. Dice cuantos enlaces cambian de
      # banda en el mapa al meter el terreno, POR BANDA DE VANO — un agregado
      # sobre todos daria el numero que uno quiera.
      - name: antes/despues del terreno en la app
        run: node tools/antes_despues_terreno.mjs

      # A4, CERRADO CON UNA MEDIDA Y NO CON UNA OPINION. Corre en CI porque su
      # conclusion depende de dos cosas que pueden cambiar: que el relieve siga
      # dando CERO EXACTO sobre terreno llano -si dejara de darlo, el doble
      # conteo volveria- y que el terreno de las dos plantas siga ahi.
      - name: A4 · el suelo bajo la placa, medido
        run: node tools/a4_suelo_bajo_placa.mjs

      # A5, EL REPECHO LOCAL. Corre en CI por lo mismo que A4: su conclusion
      # depende de dos cosas que pueden cambiar. Una, que Epstein-Peterson siga
      # moviendose con el muestreo mucho mas que Bullington -si dejara de
      # hacerlo, el limite declarado habria que revisarlo-. Y dos, la guardia
      # que exige que su `unico` reproduzca `relieveDeltaDb` EXACTAMENTE en los
      # 3.040 enlaces: el dia que alguien cambie como el motor construye
      # `real`/`liso`, este util deja de hablar del motor y se para con rc = 2
      # en vez de publicar numeros que ya no son de nadie. Probada en rojo:
      # separando la referencia un 2 % señala 498 enlaces y sale con 2.
      - name: A5 · el repecho local y la prueba de densidad
        run: node tools/a5_repecho_local.mjs

      # DE METROS DE ERROR EN LA COTA A dB DE RELIEVE. Corre en CI porque la
      # respuesta depende de la construccion delta del motor: el dia que el
      # relieve deje de cancelar un desplazamiento uniforme, la columna de
      # correlacion larga dejaria de dar cero y esto lo enseñaria. No baja
      # nada de la red: las longitudes de correlacion son MEDIDAS y van
      # escritas, y el terreno vive en este repo.
      - name: la incertidumbre de la cota, en dB por banda de vano
        run: node tools/relieve_incertidumbre.mjs --reps 8

      # LAS COMPARACIONES QUE DECIDEN SI UN DATO EXISTE. Corre en CI porque su
      # catalogo cita FUNCIONES, y si alguien renombra una el barrido se para en
      # vez de seguir diciendo que esta vigilada. Ademas comprueba que la
      # tolerancia sigue distinguiendo 1e-13 de 1 um: el dia que alguien la
      # afloje, esto lo dice.
      #
      # MIDE LOS DOS MOTORES Y CAREA SUS VEREDICTOS, no solo el de JS. La
      # primera version solo miraba el JS y dio el trabajo por hecho mientras
      # `recorta_perfil` de Python arrastraba el mismo defecto del picometro
      # que se acababa de arreglar en JS. Si falta python3 sale rc = 1 con
      # «la mitad de la auditoria no se ha hecho», NO verde: aqui python3 esta
      # -este mismo job corre `test_paridad_radio.py`-, pero el dia que deje de
      # estar tiene que enterarse alguien.
      - name: las comparaciones de coma flotante, catalogadas y medidas (los dos motores)
        run: node tools/auditoria_comparaciones.mjs

      # EL CAREO DE VANOS MUESTREADOS CONTRA ENLACES REALES. Corre en CI porque
      # el hecho que lo cierra —que ningun enlace de la cartera llega a 800 m—
      # deja de ser cierto en cuanto alguien mueva una NCU, y entonces la lectura
      # de la tabla de relieve por banda cambia.
      # ¿PUEDE ALGÚN PASO DE CI SALIR CON 0 SIN HABER MEDIDO? El cribado de los
      # cinco patrones —guarda que rinde 0, bucle de cero vueltas, tragado
      # explícito, suite que no recoge, invoca lo que no hay— sobre este repo y
      # sobre los hermanos que estén clonados.
      #
      # Y SE MIDE A SÍ MISMO: publica cuántos pasos y cuántos comandos ha
      # resuelto de los que hay, y se pone ROJO por debajo del 90 %. La primera
      # versión veía 3 ficheros de los 17 pasos de SolarGPTfull y salía casi
      # limpia — o sea, el mismo defecto que persigue, en sí misma. Sin PyYAML
      # sale con rc = 2, no con 0.
      - name: ¿algún paso puede salir verde sin haber medido?
        run: node tools/auditoria_verdes.mjs

      # ¿CORRE LA CI TODAS LAS MUTACIONES QUE HAY? El corredor de abajo lleva
      # las claves escritas A MANO, banco por banco: exige `rc = 1` exacto —lo
      # que ya ha cazado anclas caducadas— pero corre las que alguien apuntó,
      # no las que hay. Encontrado midiéndolo: las CUATRO mutaciones del
      # picómetro y del punto duplicado, añadidas hoy, estaban definidas y no
      # se corrían nunca. Sin workflow sale con rc = 2, no con 0.
      - name: ¿se corren todas las mutaciones que hay?
        run: node tools/alcance_mutaciones.mjs

      - name: vanos muestreados contra enlaces reales
        run: node tools/vanos_muestreados_vs_reales.mjs > /dev/null

      # PARIDAD JS/PYTHON. El visor predice en JS y la calibración ajusta en
      # Python; si los dos motores se separan, el ajuste calibra un modelo que
      # nadie usa. Este banco ejecuta el JS DE VERDAD con node sobre el fichero
      # del repo, no una reimplementación de lo que se supone que hace.
      - name: paridad entre los dos motores
        run: |
          set -o pipefail
          rc=0
          for f in tests/test_*.py; do
            echo "── $f ──"
            python3 "$f" || rc=1
          done
          exit $rc

      # LAS MUTACIONES SE CORREN AQUÍ, no a mano. Un banco que nadie ha visto
      # fallar no es un banco, y comprobarlo una vez el día que se escribe no
      # sirve: basta que alguien afloje una comprobación para que se quede verde
      # para siempre sin que nadie se entere.
      #
      # Se exige rc = 1 EXACTAMENTE, no «distinto de cero»: rc = 2 es «la
      # mutación ya no casa con el código», y contarlo como cazada sería el
      # falso verde que esto viene a evitar.
      # NO SE PARA EN LA PRIMERA. Se recorren TODAS y se falla al final con la
      # lista entera. El motivo es una avería real: al refactorizar
      # `difraccionBandasDetalle` se movió una línea a la que anclaban DOS
      # mutaciones —`bordeDeArriba` en test_radio_geom y `js_borde_top` en el de
      # paridad—, y las dos dejaron de casar a la vez. Parando en la primera, la
      # segunda no se ve hasta el viaje siguiente. Un refactor que mueva una
      # línea con varias anclas es justo el caso normal, no el raro.
      #
      # NO SE LE PONE UNA TUBERÍA A `rojo`. Ni `| tee`, ni `| grep`: bash
      # ejecuta el lado izquierdo de una tubería en un SUBSHELL, y ahí `rotas`
      # se acumula en una copia que muere al acabar. El paso saldría verde con
      # las anclas rotas — el falso verde exacto que este bloque viene a evitar.
      # Cazado probándolo: la primera versión de esta prueba lo hizo y «no cazó
      # nada» con dos anclas rotas a propósito.
      - name: y las mutaciones, en rojo
        run: |
          log=$(mktemp)
          rotas=""
          rojo () {
            corredor="$1"; banco="$2"; shift 2
            for m in "$@"; do
              set +e
              MUTA="$m" "$corredor" "$banco" > "$log" 2>&1
              rc=$?
              set -e
              if [ "$rc" -ne 1 ]; then
                echo "::error::$banco con la mutación «$m» salió rc=$rc; se esperaba 1 (banco en rojo)"
                tail -30 "$log"
                # Sin salto de línea embebido: dentro de un bloque `run: |` una
                # continuación con menos sangría CIERRA el escalar y rompe el
                # YAML entero. El separador es `;` y lo desdobla el `tr` final.
                rotas="$rotas;$banco · $m (rc=$rc)"
                continue
              fi
              echo "  $banco · $m: roja, bien"
            done
          }
          rojo node tests/test_radio_geom.js filoDesdeSuelo semiCuerda senoPorCoseno sinHueco siemprCruza \
                                             sinExigeF fresnelSinLambda filoSinCorte rupturaMitad bordeDeArriba \
                                             sinReflejado sueloSinPerdida anguloDirecto \
                                             sinCentrar sinRecorte92 terrenoDeygout sinRecortarVano \
                                             cantoAlMasAlto puntoMudo \
                                             sinTolerancia toleranciaFloja puntoDuplicado

          # Las de paridad rompen UN SOLO LADO, y por los dos lados: una
          # mutación que tocase los dos ficheros a la vez dejaría el banco
          # verde, que es exactamente la avería que esto vigila.
          rojo node tests/test_radio_malla.js sensInventada siempreCalib rozarEsTapar vegCallada \
                                              canalCallado noSeSabeEsSi sinRaizArt sinRutaEsCero nuncaArbol \
                                              relieveCallado relieveCortoCero dosRayosSinLisa \
                                              mezclaSigue mezclaSiempre \
                                              sinUmbralCorto umbralApaga

          # EL CENSO DE MOTIVOS TIENE QUE SALIR PUBLICADO, no en un log. Existe
          # porque 568 enlaces llevaban un mes con motivo `no cubre el vano` y
          # nadie los contaba: el dato estaba y no se leia.
          rojo node tests/test_censo_motivos.js sinDenominador sinPorcentaje sinMudos informeMudo

          # EL TERRENO DE LA PLANTA. `terreno_planta.js` lee el MISMO
          # `<planta>_relieve.json` que consume el 3D de cobertura-zigbee, y de
          # ahi sale el perfil con el que el motor calcula el relieve.
          #
          # `sinBordeMalla` salio DORMIDA la primera vez y merece la nota: al
          # pasarse por arriba de la malla, `z[...]` da `undefined`, y en JS
          # `undefined == null`, asi que el control de esquinas la tapaba. Pero
          # en la ULTIMA COLUMNA el indice no se sale del array — cae en la
          # PRIMERA COLUMNA DE LA FILA SIGUIENTE, en rango y equivocada. Con el
          # caso bueno puesto, `cotaEn(25,5)` devuelve 2,5 m del otro extremo de
          # la planta en vez de null.
          rojo node tests/test_terreno_planta.js sinBordeMalla huecoRelleno bilinealPlana \
                                                 sinExtremo pasoFijo motivoAlReves sueloCero \
                                                 validaFloja coberturaCiega antenaEnterrada

          # EL TERRENO QUE VIAJA CON EL PROYECTO. `shaFingido` salio DORMIDA la
          # primera vez: al arreglar la cache, la cadena `shaVerificado: sha
          # !== null };` paso a aparecer DOS veces y `String.replace` cambio la
          # de la cache, dejando el retorno intacto. Es el robo de ancla de
          # siempre. Arreglado poniendo la decision en UN solo sitio.
          # Y `shaPresetCiego` tambien: el caso de prueba lo cazaba el OTRO
          # sha, asi que no discriminaba. Hizo falta un caso con manifiesto y
          # fichero coherentes ENTRE SI pero distintos de lo que el preset
          # espera — o sea, terreno regenerado sin actualizar el proyecto.
          # `rotuloMudo` salio rc = 2 al anyadir la calidad al rotulo: el ancla
          # se habia movido. Es JUSTO lo que la regla de «rc = 1 EXACTO» existe
          # para cazar, y por eso no se relaja nunca a «distinto de cero».
          rojo node tests/test_terreno_proyecto.js shaFicheroCiego shaPresetCiego sinDesfase \
                                                   origenAOjo rotuloMudo shaFingido sinTerrenoMudo \
                                                   calidadMuda sinIncertidumbre incertidumbreComoda

          rojo node tests/test_rf_panel.js mapaAparte detalleOtraH firmaSinMotor sinParamsMiente \
                                            detalleOtroTope sinOrdenT

          rojo node tests/test_rf_indice.js sinIndice ddaSinY sinDedupe selloFijo celdaEnorme

          # La antena de la TCU: gira con el tubo, se desplaza en LATERAL, y a
          # partir de ~35° queda dentro de la banda de su propio modulo.
          rojo node tests/test_antena_tcu.js anclaFija sinLateral holguraAlSuelo \
                                             cercaSinLambda patronPlano conductorNaN \
                                             panelAlEje panelSinHuella \
                                             ejeMiente ejeGlobal tapaSinFondo \
                                             tierraCallada ejeNombreViejo

          rojo node tests/test_estadistica.js sigmaPoblacional empatesSinMedia pUnaCola glMalos \
                                              sinInterpolar nanCallado

          rojo node tests/test_careo_elburgo.js sinGuardiaGeo podaMala sinTramoFila sinPasillo \
                                                sinSupuestas sinRotulo sinSignificativa sinSigma \
                                                anguloConstante

          # LOS DOS UTILES QUE NO VIGILABA NADIE. `careo_elburgo.mjs` si lo
          # corre su banco de punta a punta; `sensibilidad_eje.mjs` y
          # `sin_dato_horas.mjs` no los corria nada, y se notaba: el segundo
          # llevaba `/home/user/Siting/...` a pelo, o sea que no arrancaba en
          # ninguna otra maquina. Este banco los EJECUTA contra fixtures, con
          # los numeros calculados a mano.
          rojo node tests/test_utiles_rf.js ejeSinAntena vegPlana cantoAlEje \
                                            corteFijo rotuloFijo sinSenPhi

          # LA PUERTA DE LA HOLGURA UNICA. No compara numeros: lee el fuente de
          # los dos motores y cuenta cuantas funciones dan el despeje de una
          # fila. Tiene que ser UNA. La banda vertical y el plano inclinado
          # daban el mismo despeje -0,000000 m- y distinto CANTO, asi que un
          # banco de numeros no podia cazar que convivieran; este si.
          rojo node tests/test_una_holgura.js segundaHolgura segundaHolguraPy bandaDeVuelta \
                                              refEnLaApp nombresDistintos refHuerfana \
                                              segundaLisa segundaLisaPy relieveViejo

          # `py_sin_hueco`, `py_borde_top`, `js_semi_cuerda` y `js_borde_top`
          # se han ido con las familias de banda: esas funciones ya no existen
          # en ningun motor, asi que sus mutaciones no tendrian que mutar.
          # LAS TRES DE LA GEOMETRIA IMPOSIBLE. La paridad estuvo VERDE con once
          # casos que llevaban la antena bajo tierra, porque los dos motores se
          # equivocaban IGUAL. `py_sin_guarda`/`js_sin_guarda` tumban la guarda por
          # un lado -y entonces la familia `relieve` ya discrepa-, y
          # `js_guarda_todo` prueba el otro extremo: un «no» universal, que pasaria
          # todas las comprobaciones de «no». El caso de los DOS motores rotos a la
          # vez no lo puede producir una mutacion de un solo lado, y lo cubre la
          # comprobacion de clases: probado rompiendo los dos, `relieve` sale OK y
          # la de clases saca 22 cruces.
          rojo python3 tests/test_paridad_radio.py py_fspl_001 py_refl_pol \ \
                                                   py_sin_tolerancia js_sin_tolerancia py_punto_duplicado
                                                   py_sin_guarda js_sin_guarda js_guarda_todo \
                                                   py_csqrt_rama \
                                                   js_tol_regimen js_fase_signo \
                                                   py_ancla_fija js_sin_lateral py_patron_iso \
                                                   js_cerca_fija py_conductor \
                                                   js_panel_eje py_panel_huella \
                                                   py_eje_medida js_eje_cero py_tapa_cero \
                                                   js_parte_eje py_sin_senphi py_tierra_muda

          # rc = 2 es «la mutación ya no casa con el código»: un ancla que se
          # quedó atrás en un refactor. NO es «cazada», y por eso esto falla.
          if [ -n "$rotas" ]; then
            echo "::error::mutaciones que NO salieron rc=1 (rc=2 = ancla que se quedo atras en un refactor; NO es «cazada»):"
            echo "$rotas" | tr ';' '\n' | grep -v '^$'
            exit 1
          fi

      # ══ EL CENSO DE BANCOS: «NO COMPROBADO» ≠ «COMPROBADO Y PASA» ══════════
      #
      # POR QUE EXISTE. Cuatro pasos de esta CI imprimian «No se ha medido
      # nada. Esto no es un verde» y salian con 0, asi que en la pagina de
      # checks se veian EXACTAMENTE igual que los que si median. Entre ellos el
      # careo del terreno contra el 3D —200.000 muestras, 0 discrepancias, bit
      # a bit— y el careo de cotas de equipo entre repos. Dos puertas que nunca
      # habian corrido, una de ellas con un nombre de paso que ni lo decia.
      #
      # Se encontro mirando cuanto tardaba cada paso: los cuatro cerraban en
      # menos de un segundo. El texto decia la verdad; el codigo de salida la
      # contradecia; el agregador lee el codigo de salida.
      #
      # QUE HACE. Publica los tres estados por separado —MIDE / NO COMPROBADO /
      # ROJO—, en el resumen de la corrida (que es lo que se mira sin abrir los
      # logs) y como anotacion ::warning:: al lado del tick verde. Y se para si
      # algo salio rc = 1.
      #
      # NO pone el job en rojo por un rc = 2: un clonado que falla por red no es
      # un hallazgo. Pero tampoco pasa por verde callando.
      - name: censo de bancos (que «no comprobado» no parezca verde)
        if: always()
        run: |
          f="$RUNNER_TEMP/censo_bancos"
          [ -f "$f" ] || { echo "::error::el censo no se escribio: ningun paso lo alimento"; exit 1; }
          # ── CUANTOS ESPERABA. El censo sabia decir lo que le contaron y NO
          #    cuantos deberian haberle contado: si un paso moria antes de
          #    escribir su linea, censaba 3 de 4 y se quedaba tan ancho.
          #    «He mirado» y «esta bien» son dos afirmaciones, y esta puerta
          #    solo hacia la segunda — el mismo defecto que vino a arreglar.
          #    El numero se sube A MANO al anyadir un paso que alimente el
          #    censo, y si alguien se olvida, esto se para.
          ESPERADOS=4
          censados=$(grep -c . "$f" || true)
          mide=0; nc=0; rojo=0
          {
            echo "### Censo de bancos"
            echo ""
            echo "| banco | estado |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          # El separador es «|» A PROPOSITO: los nombres llevan espacios y un
          # `read -r nombre rc` los parte por la primera palabra. Salio en la
          # primera pasada: los cuatro bancos aparecian como «el», «el», «la»,
          # «las», todos NO COMPROBADO aunque median.
          while IFS='|' read -r rc nombre; do
            case "$rc" in
              0) est="✅ MIDE";          mide=$((mide+1)) ;;
              1) est="❌ ROJO";          rojo=$((rojo+1)) ;;
              *) est="⚠️ NO COMPROBADO"; nc=$((nc+1)) ;;
            esac
            printf '| %s | %s |\n' "$nombre" "$est" >> "$GITHUB_STEP_SUMMARY"
            printf '  %-40s %s\n' "$nombre" "$est"
          done < "$f"
          echo ""
          echo "  miden: $mide · NO COMPROBADOS: $nc · rojos: $rojo"
          printf '\n**miden %d · NO COMPROBADOS %d · rojos %d**\n' "$mide" "$nc" "$rojo" >> "$GITHUB_STEP_SUMMARY"
          echo "  censados: $censados de $ESPERADOS esperados"
          if [ "$censados" != "$ESPERADOS" ]; then
            echo "::error title=CENSO INCOMPLETO::han llegado $censados lineas y se esperaban $ESPERADOS."
            echo "  Un paso que alimenta el censo no ha llegado a escribir su linea, o se ha"
            echo "  anyadido uno sin subir ESPERADOS. En los dos casos el censo esta mintiendo."
            printf '\n> ❌ censo incompleto: %s de %s\n' "$censados" "$ESPERADOS" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$rojo" != "0" ]; then echo "::error::$rojo banco(s) en rojo"; exit 1; fi
          if [ "$nc" != "0" ]; then
            echo "::warning title=NO COMPROBADO::$nc banco(s) no han medido nada. Esto NO es un verde entero."
            printf '\n> ⚠️ %d banco(s) no han medido nada. Esto NO es un verde entero.\n' "$nc" >> "$GITHUB_STEP_SUMMARY"
          fi

      # EL ENLACE A LA GUÍA DE PUERTAS, COMPROBADO. Un enlace roto al documento
      # que dice «una puerta verde afirma dos cosas» sería el chiste final.
      # Resuelve el fichero en el clon de `proyectos` que haya al lado —el del
      # PIN si este repo lo fija— y si no hay, lo trae con --depth 1 (es
      # público). Sin red y sin clon sale con rc = 2, no con 0.
      - name: el enlace a la guía de puertas apunta a algo que existe
        run: bash docs/enlace_guia.sh
