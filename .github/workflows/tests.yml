# El repo no tenía ninguna comprobación automática. La capa RF pinta un mapa de
# cobertura que se mira para decidir dónde va una NCU, y se equivocaba en 27 dB
# sin que nada lo dijera (RF-01). Un banco que no corre nadie es decoración.
name: tests
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: banco de pruebas
        run: |
          set -o pipefail
          rc=0
          for f in tests/test_*.js; do
            echo "── $f ──"
            node "$f" || rc=1
          done
          exit $rc

      # LA HERRAMIENTA DE INFORME, aunque no sea un banco. Extrae `rfRows` y
      # `buildAdjacency` del HTML con una expresión regular, así que se rompe
      # sola el día que alguien los renombre — y sin esto se rompería en
      # silencio, el día que a alguien le hiciera falta.
      - name: la herramienta de malla arranca sobre una planta real
        run: node tools/malla_plantas.mjs --planta BURGO > /dev/null

      # EL CAREO CONTRA EL 3D NO PUEDE CORRER AQUI —necesita cobertura-zigbee, y
      # un banco que dependa del repo hermano sale verde en una maquina y rojo
      # en la otra; ya paso en este repo—. Pero SI arranca, y eso es justo lo
      # que habria cazado el `require('/home/user/Siting/...')` absoluto que
      # llevaba dentro uno de los utiles que nadie corria. Sin hermano carga el
      # motor, comprueba que la API que usa sigue existiendo, dice que no ha
      # comprobado nada y sale con 0.
      - name: el careo de terreno contra el 3D arranca (sin hermano, no carea)
        run: node tools/careo_terreno_3d.mjs

      # Igual que el de arriba: necesita los levantamientos de ayora y sanjose,
      # que viven en el hermano. Aqui solo se comprueba que arranca y que la
      # API del motor que usa sigue existiendo.
      - name: el informe de relieve por planta arranca (sin hermano, no mide)
        run: node tools/relieve_plantas.mjs

      # Lo mismo: los layouts con meteo viven en el hermano.
      - name: el informe de antena de la HSU arranca (sin hermano, no mide)
        run: node tools/antena_hsu.mjs

      # LAS COTAS DE EQUIPO QUE ESTE REPO COPIA. La mitad que SI corre sin
      # hermano —y es la que de verdad impide que el problema vuelva— es que
      # ninguna `_fuente` cite un NUMERO DE LINEA. Se encontraron SIETE citas
      # asi y SEIS estaban caducadas: nadie las movio, se movieron solas cuando
      # el PR #714 anyadio comentarios a esos ficheros. Una cita podrida es peor
      # que ninguna, porque parece que alguien lo comprobo.
      - name: las cotas de equipo copiadas, y sus citas
        run: node tools/careo_equipos.mjs

      # ESTE SI MIDE EN CI, porque el terreno viaja con el proyecto y vive en
      # este repo: no depende del hermano. Dice cuantos enlaces cambian de
      # banda en el mapa al meter el terreno, POR BANDA DE VANO — un agregado
      # sobre todos daria el numero que uno quiera.
      - name: antes/despues del terreno en la app
        run: node tools/antes_despues_terreno.mjs

      # A4, CERRADO CON UNA MEDIDA Y NO CON UNA OPINION. Corre en CI porque su
      # conclusion depende de dos cosas que pueden cambiar: que el relieve siga
      # dando CERO EXACTO sobre terreno llano -si dejara de darlo, el doble
      # conteo volveria- y que el terreno de las dos plantas siga ahi.
      - name: A4 · el suelo bajo la placa, medido
        run: node tools/a4_suelo_bajo_placa.mjs

      # PARIDAD JS/PYTHON. El visor predice en JS y la calibración ajusta en
      # Python; si los dos motores se separan, el ajuste calibra un modelo que
      # nadie usa. Este banco ejecuta el JS DE VERDAD con node sobre el fichero
      # del repo, no una reimplementación de lo que se supone que hace.
      - name: paridad entre los dos motores
        run: |
          set -o pipefail
          rc=0
          for f in tests/test_*.py; do
            echo "── $f ──"
            python3 "$f" || rc=1
          done
          exit $rc

      # LAS MUTACIONES SE CORREN AQUÍ, no a mano. Un banco que nadie ha visto
      # fallar no es un banco, y comprobarlo una vez el día que se escribe no
      # sirve: basta que alguien afloje una comprobación para que se quede verde
      # para siempre sin que nadie se entere.
      #
      # Se exige rc = 1 EXACTAMENTE, no «distinto de cero»: rc = 2 es «la
      # mutación ya no casa con el código», y contarlo como cazada sería el
      # falso verde que esto viene a evitar.
      # NO SE PARA EN LA PRIMERA. Se recorren TODAS y se falla al final con la
      # lista entera. El motivo es una avería real: al refactorizar
      # `difraccionBandasDetalle` se movió una línea a la que anclaban DOS
      # mutaciones —`bordeDeArriba` en test_radio_geom y `js_borde_top` en el de
      # paridad—, y las dos dejaron de casar a la vez. Parando en la primera, la
      # segunda no se ve hasta el viaje siguiente. Un refactor que mueva una
      # línea con varias anclas es justo el caso normal, no el raro.
      #
      # NO SE LE PONE UNA TUBERÍA A `rojo`. Ni `| tee`, ni `| grep`: bash
      # ejecuta el lado izquierdo de una tubería en un SUBSHELL, y ahí `rotas`
      # se acumula en una copia que muere al acabar. El paso saldría verde con
      # las anclas rotas — el falso verde exacto que este bloque viene a evitar.
      # Cazado probándolo: la primera versión de esta prueba lo hizo y «no cazó
      # nada» con dos anclas rotas a propósito.
      - name: y las mutaciones, en rojo
        run: |
          log=$(mktemp)
          rotas=""
          rojo () {
            corredor="$1"; banco="$2"; shift 2
            for m in "$@"; do
              set +e
              MUTA="$m" "$corredor" "$banco" > "$log" 2>&1
              rc=$?
              set -e
              if [ "$rc" -ne 1 ]; then
                echo "::error::$banco con la mutación «$m» salió rc=$rc; se esperaba 1 (banco en rojo)"
                tail -30 "$log"
                # Sin salto de línea embebido: dentro de un bloque `run: |` una
                # continuación con menos sangría CIERRA el escalar y rompe el
                # YAML entero. El separador es `;` y lo desdobla el `tr` final.
                rotas="$rotas;$banco · $m (rc=$rc)"
                continue
              fi
              echo "  $banco · $m: roja, bien"
            done
          }
          rojo node tests/test_radio_geom.js filoDesdeSuelo semiCuerda senoPorCoseno sinHueco siemprCruza \
                                             sinExigeF fresnelSinLambda filoSinCorte rupturaMitad bordeDeArriba \
                                             sinReflejado sueloSinPerdida anguloDirecto \
                                             sinCentrar sinRecorte92 terrenoDeygout sinRecortarVano

          # Las de paridad rompen UN SOLO LADO, y por los dos lados: una
          # mutación que tocase los dos ficheros a la vez dejaría el banco
          # verde, que es exactamente la avería que esto vigila.
          rojo node tests/test_radio_malla.js sensInventada siempreCalib rozarEsTapar vegCallada \
                                              canalCallado noSeSabeEsSi sinRaizArt sinRutaEsCero nuncaArbol \
                                              relieveCallado relieveCortoCero dosRayosSinLisa \
                                              mezclaSigue mezclaSiempre

          # EL TERRENO DE LA PLANTA. `terreno_planta.js` lee el MISMO
          # `<planta>_relieve.json` que consume el 3D de cobertura-zigbee, y de
          # ahi sale el perfil con el que el motor calcula el relieve.
          #
          # `sinBordeMalla` salio DORMIDA la primera vez y merece la nota: al
          # pasarse por arriba de la malla, `z[...]` da `undefined`, y en JS
          # `undefined == null`, asi que el control de esquinas la tapaba. Pero
          # en la ULTIMA COLUMNA el indice no se sale del array — cae en la
          # PRIMERA COLUMNA DE LA FILA SIGUIENTE, en rango y equivocada. Con el
          # caso bueno puesto, `cotaEn(25,5)` devuelve 2,5 m del otro extremo de
          # la planta en vez de null.
          rojo node tests/test_terreno_planta.js sinBordeMalla huecoRelleno bilinealPlana \
                                                 sinExtremo pasoFijo motivoAlReves sueloCero \
                                                 validaFloja coberturaCiega antenaEnterrada

          # EL TERRENO QUE VIAJA CON EL PROYECTO. `shaFingido` salio DORMIDA la
          # primera vez: al arreglar la cache, la cadena `shaVerificado: sha
          # !== null };` paso a aparecer DOS veces y `String.replace` cambio la
          # de la cache, dejando el retorno intacto. Es el robo de ancla de
          # siempre. Arreglado poniendo la decision en UN solo sitio.
          # Y `shaPresetCiego` tambien: el caso de prueba lo cazaba el OTRO
          # sha, asi que no discriminaba. Hizo falta un caso con manifiesto y
          # fichero coherentes ENTRE SI pero distintos de lo que el preset
          # espera — o sea, terreno regenerado sin actualizar el proyecto.
          rojo node tests/test_terreno_proyecto.js shaFicheroCiego shaPresetCiego sinDesfase \
                                                   origenAOjo rotuloMudo shaFingido sinTerrenoMudo

          rojo node tests/test_rf_panel.js mapaAparte detalleOtraH firmaSinMotor sinParamsMiente \
                                            detalleOtroTope sinOrdenT

          rojo node tests/test_rf_indice.js sinIndice ddaSinY sinDedupe selloFijo celdaEnorme

          # La antena de la TCU: gira con el tubo, se desplaza en LATERAL, y a
          # partir de ~35° queda dentro de la banda de su propio modulo.
          rojo node tests/test_antena_tcu.js anclaFija sinLateral holguraAlSuelo \
                                             cercaSinLambda patronPlano conductorNaN \
                                             panelAlEje panelSinHuella \
                                             ejeMiente ejeGlobal tapaSinFondo \
                                             tierraCallada ejeNombreViejo

          rojo node tests/test_estadistica.js sigmaPoblacional empatesSinMedia pUnaCola glMalos \
                                              sinInterpolar nanCallado

          rojo node tests/test_careo_elburgo.js sinGuardiaGeo podaMala sinTramoFila sinPasillo \
                                                sinSupuestas sinRotulo sinSignificativa sinSigma \
                                                anguloConstante

          # LOS DOS UTILES QUE NO VIGILABA NADIE. `careo_elburgo.mjs` si lo
          # corre su banco de punta a punta; `sensibilidad_eje.mjs` y
          # `sin_dato_horas.mjs` no los corria nada, y se notaba: el segundo
          # llevaba `/home/user/Siting/...` a pelo, o sea que no arrancaba en
          # ninguna otra maquina. Este banco los EJECUTA contra fixtures, con
          # los numeros calculados a mano.
          rojo node tests/test_utiles_rf.js ejeSinAntena vegPlana cantoAlEje \
                                            corteFijo rotuloFijo sinSenPhi

          # LA PUERTA DE LA HOLGURA UNICA. No compara numeros: lee el fuente de
          # los dos motores y cuenta cuantas funciones dan el despeje de una
          # fila. Tiene que ser UNA. La banda vertical y el plano inclinado
          # daban el mismo despeje -0,000000 m- y distinto CANTO, asi que un
          # banco de numeros no podia cazar que convivieran; este si.
          rojo node tests/test_una_holgura.js segundaHolgura segundaHolguraPy bandaDeVuelta \
                                              refEnLaApp nombresDistintos refHuerfana \
                                              segundaLisa segundaLisaPy relieveViejo

          # `py_sin_hueco`, `py_borde_top`, `js_semi_cuerda` y `js_borde_top`
          # se han ido con las familias de banda: esas funciones ya no existen
          # en ningun motor, asi que sus mutaciones no tendrian que mutar.
          # LAS TRES DE LA GEOMETRIA IMPOSIBLE. La paridad estuvo VERDE con once
          # casos que llevaban la antena bajo tierra, porque los dos motores se
          # equivocaban IGUAL. `py_sin_guarda`/`js_sin_guarda` tumban la guarda por
          # un lado -y entonces la familia `relieve` ya discrepa-, y
          # `js_guarda_todo` prueba el otro extremo: un «no» universal, que pasaria
          # todas las comprobaciones de «no». El caso de los DOS motores rotos a la
          # vez no lo puede producir una mutacion de un solo lado, y lo cubre la
          # comprobacion de clases: probado rompiendo los dos, `relieve` sale OK y
          # la de clases saca 22 cruces.
          rojo python3 tests/test_paridad_radio.py py_fspl_001 py_refl_pol \
                                                   py_sin_guarda js_sin_guarda js_guarda_todo \
                                                   py_csqrt_rama \
                                                   js_tol_regimen js_fase_signo \
                                                   py_ancla_fija js_sin_lateral py_patron_iso \
                                                   js_cerca_fija py_conductor \
                                                   js_panel_eje py_panel_huella \
                                                   py_eje_medida js_eje_cero py_tapa_cero \
                                                   js_parte_eje py_sin_senphi py_tierra_muda

          # rc = 2 es «la mutación ya no casa con el código»: un ancla que se
          # quedó atrás en un refactor. NO es «cazada», y por eso esto falla.
          if [ -n "$rotas" ]; then
            echo "::error::mutaciones que NO salieron rc=1 (rc=2 = ancla que se quedo atras en un refactor; NO es «cazada»):"
            echo "$rotas" | tr ';' '\n' | grep -v '^$'
            exit 1
          fi
